name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract and tests (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: ${{ matrix.python-version }}
      # Offline contract check on the standard library only (3.11 is below requires-python, so
      # this job does not install the package; the python job below covers deps and mypy).
      install-command: "true"
      format-check: false # follow-up: adopt ruff format
      typecheck-command: "" # mypy runs in the python job on the locked environment
      test-command: bash scripts/check.sh

  # Shared workflow on the locked environment: uv sync --frozen --all-extras (uv.lock, with
  # platform-backend-core pinned to a reviewed Git commit), Ruff, mypy ([tool.mypy]) and the
  # whole pytest suite, including the PostgreSQL runtime tests formerly in shared-runtime.yml,
  # under a coverage gate; then the wheel build.
  python:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: "3.12"
      postgres: true
      format-check: false # follow-up: adopt ruff format
      # Ratchet: measured 87.06% on 2026-10-24 (ADR-0004: threshold = measured, rounded down).
      coverage-threshold: "87"
      test-command: |
        PLATFORM_TEST_DSN="$DATABASE_URL" python -m pytest -q --cov --cov-report=
        uv build --wheel --out-dir dist .

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1

  image:
    # Proves the Dockerfile builds from a clean checkout. Nothing is pushed or deployed.
    name: Container image (build only, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build container image (no push)
        run: docker build --pull --tag platform-security:ci .

      - name: Image imports the service and runs as non-root
        run: |
          docker run --rm platform-security:ci python -c "import platform_backend_core, platform_security.app"
          test "$(docker run --rm platform-security:ci id -u)" != 0
