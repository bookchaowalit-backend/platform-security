[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "platform-security"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["platform-backend-core==0.1.0", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]
[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28,<1"]
# Lint, type check and coverage tools for CI (uv sync --frozen --all-extras).
dev = ["mypy==2.4.0", "ruff==0.17.1", "pytest-cov==7.1.0"]
[tool.uv.sources]
# Not on PyPI: lock the reviewed commit the runtime tests and Dockerfile wheelhouse use,
# so the resolver can never pick up a same-named PyPI package (dependency confusion).
platform-backend-core = { git = "https://github.com/bookchaowalit-backend/platform-backend-core.git", rev = "d00e0119c2e47da3942d9c7b4b88828953f8bc5a" }
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "runtime_tests"]

[tool.coverage.run]
source = ["src/platform_security", "scripts"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests", "runtime_tests"]
# tests import the scripts and runtime_tests helpers by module name (sys.path / pytest rootdir).
mypy_path = "src:scripts:runtime_tests"
explicit_package_bases = true
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# The pinned platform-backend-core commit ships no py.typed marker; analyse it anyway.
module = ["platform_backend_core", "platform_backend_core.*"]
follow_untyped_imports = true
